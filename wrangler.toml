# Cloudflare Pages configuration
# https://developers.cloudflare.com/pages/

name = "valuation-memory-bank"
compatibility_date = "2024-01-01"
pages_build_output_dir = "dist/public"

[build]
command = "npm run build:client"
output_directory = "dist/public"

[vars]
NODE_ENV = "production"
AUTH_ENABLED = "false"
AI_ENABLED = "false"
# VITE_API_URL is set in the Cloudflare Pages dashboard (points to Render backend)
