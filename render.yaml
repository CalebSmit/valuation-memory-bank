services:
  - type: web
    name: valuation-memory-bank-api
    runtime: node
    plan: free
    buildCommand: node --version && npm install && npm run build:server
    startCommand: sh scripts/start-production.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUTH_ENABLED
        value: false
      - key: AI_ENABLED
        value: false
    disk:
      name: sqlite-data
      mountPath: /data
      sizeGB: 1
