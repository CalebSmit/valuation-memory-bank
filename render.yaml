services:
  - type: web
    name: valuation-memory-bank-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node dist/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUTH_ENABLED
        value: false
      - key: AI_ENABLED
        value: false
      # Allowed CORS origins (comma-separated) — Cloudflare frontend lives here
      - key: CORS_ORIGINS
        value: https://valuation-memory-bank.pages.dev
      # TURSO_DATABASE_URL and TURSO_AUTH_TOKEN are set directly in Render dashboard
      # (not stored here to avoid committing credentials to a public repo)
    healthCheckPath: /api/me
