services:
  - type: web
    name: valuation-memory-bank-api
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install --omit=dev
    startCommand: node dist/index.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUTH_ENABLED
        value: false
      - key: AI_ENABLED
        value: false
      # Allowed CORS origins (comma-separated) — Cloudflare frontend lives here
      - key: CORS_ORIGINS
        value: https://valuation-memory-bank.pages.dev
    healthCheckPath: /api/me
    # Persistent disk — survives container restarts on Render free tier
    disk:
      name: valuation-memory-bank-data
      mountPath: /var/data
      sizeGB: 1
